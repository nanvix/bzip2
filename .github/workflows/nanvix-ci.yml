name: Nanvix CI

on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches: ["nanvix/**"]
  pull_request:
    branches: ["nanvix/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v1.10.1
    with:
      zutil-version: "v0.7.25"
      memory-sizes: '["128mb","256mb"]'
      matrix-exclude: '[{"platform":"hyperlight","process-mode":"single-process"},{"platform":"hyperlight","process-mode":"multi-process"}]'
      caller-event-name: ${{ github.event_name }}
      windows-test: false
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  ci-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v1.10.1
    with:
      zutil-version: "v0.7.25"
      memory-sizes: '["128mb","256mb"]'
      matrix-exclude: '[{"platform":"hyperlight","process-mode":"single-process"},{"platform":"hyperlight","process-mode":"multi-process"}]'
      caller-event-name: 'schedule'
      windows-test: false
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # -------------------------------------------------------------------
  # Windows CI: cross-compile via Docker, then test locally.
  # The reusable workflow's windows-test is disabled (windows-test: false)
  # because it only runs setup+test (no build). bzip2 requires Docker to
  # cross-compile, so we use a self-hosted Windows runner with Docker.
  # -------------------------------------------------------------------
  ci-windows:
    needs: [ci, ci-scheduled]
    if: >-
      !cancelled() &&
      (needs.ci.result == 'success' || needs.ci-scheduled.result == 'success')
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup
        shell: pwsh
        run: .\z.ps1 setup

      - name: Build (cross-compile via Docker)
        shell: pwsh
        run: .\z.ps1 --with-docker build

      - name: Test (run locally via nanvixd.exe)
        shell: pwsh
        run: .\z.ps1 test
